<div class="app-layout">
    @if (showHeader()) {
        <app-header (menuToggle)="toggleMobileMenu()"></app-header>
        <app-menu [isMobileMenuOpen]="isMobileMenuOpen"></app-menu>

        <div
            class="mobile-menu-overlay"
            [class.show]="isMobileMenuOpen"
            (click)="toggleMobileMenu()">
        </div>
    }

    <main [ngClass]="{'main-content': showHeader(), 'full-width-content': !showHeader()}">
        <router-outlet></router-outlet>
    </main>
</div>
