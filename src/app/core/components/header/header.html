<header class="app-header">
    <div class="header-content">
        <div class="header-left">
            <button class="menu-toggle action-btn" (click)="onMenuToggleClick()" aria-label="Toggle Menu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-logo">
                <a (click)="clickRedirect('dashboard')">Admin<strong>Panel</strong></a>
            </div>
        </div>

        <div class="header-right">
            <div class="header-actions">
                <button class="action-btn" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">3</span>
                </button>
            </div>

            <div
                class="user-profile"
                (click)="toggleProfileMenu()"
                [class.is-active]="isProfileMenuOpen">

                <span class="user-name">John Doe</span>
                <div class="user-avatar">
                    <span>JD</span>
                </div>

                <div class="profile-dropdown" [class.show]="isProfileMenuOpen">
                    <ul class="dropdown-list">
                        <li class="dropdown-item">
                            <a (click)="clickRedirect(paths.profile)">
                                <i class="fas fa-user-circle"></i>
                                <span>My Profile</span>
                            </a>
                        </li>
                        <li class="dropdown-item">
                            <a (click)="clickRedirect(paths.settings)">
                                <i class="fas fa-cog"></i>
                                <span>Settings</span>
                            </a>
                        </li>
                        <li class="dropdown-divider"></li>
                        <li class="dropdown-item">
                            <a (click)="clickRedirect(paths.login)">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>Logout</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>
